<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Railyn Notifications</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f6f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333333;">
  <div style="background-color: #f4f6f8; padding: 30px 10px; width: 100%;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(30,111,43,0.06); border: 1px solid #e2e8f0;">
      
      <!-- Shared Header Banner (Railyn Forest & Gold Theme with Embedded Logo) -->
      <table style="width: 100%; background-color: #1E6F2B; border-collapse: collapse; border-bottom: 4px solid #fbbf24;">
        <tr>
          <td style="padding: 22px 10px 22px 25px; vertical-align: middle; width: 50px;">
            <div style="width: 44px; height: 44px; background: transparent; border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden;">
              <img src="{logo_src}" alt="Railyn Logo" style="width: 100%; height: 100%; object-fit: contain; transform: scale(1.5); display: block;" />
            </div>
          </td>
          <td style="padding: 22px 25px 22px 10px; vertical-align: middle; text-align: left;">
            <span style="color: #ffffff; font-size: 26px; font-weight: 800; letter-spacing: 1.5px; font-family: Arial, sans-serif;">RAILYN</span>
            <div style="color: #dcfce7; font-size: 10px; font-weight: 600; margin-top: 3px; letter-spacing: 0.5px; text-transform: uppercase;">Railway Passenger Services</div>
          </td>
          <td style="text-align: right; padding: 22px 25px; vertical-align: middle;">
          </td>
        </tr>
      </table>

      <!-- Inner Content -->
      <div style="padding: 30px 25px;">
        {{CONTENT}}
      </div>

      <!-- Footer Info -->
      <div style="background-color: #f8fafc; padding: 20px 25px; border-top: 1px solid #edf2f7; text-align: center;">
        <p style="font-size: 11px; color: #64748b; margin: 0 0 8px 0; line-height: 1.5;">
          This is an official system-generated notification from Railyn Passenger Operations.<br/>
          Do not reply to this email. For customer support, visit your Railyn dashboard or email <a href="mailto:haldar.saumili843@gmail.com" style="color: #1E6F2B; text-decoration: none; font-weight: 600;">haldar.saumili843@gmail.com</a>.
        </p>
        <p style="font-size: 10px; color: #94a3b8; margin: 0;">
          &copy; 2026 Railyn Systems. All rights reserved.
        </p>
      </div>

    </div>
  </div>
</body>
</html>
